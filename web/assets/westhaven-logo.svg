<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082445"/>
      <stop offset="100%" stop-color="#1a4b7f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd37a"/>
      <stop offset="100%" stop-color="#c88a1e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="40" y="40" width="1520" height="820" rx="28" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.75"/>

  <g filter="url(#shadow)">
    <rect x="220" y="190" width="1160" height="360" rx="48" fill="#0d2b4f" stroke="url(#gold)" stroke-width="10"/>
    <text x="800" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="164" font-weight="700" fill="#f4f8ff" letter-spacing="6">WESTHAVEN</text>
    <rect x="510" y="430" width="580" height="92" rx="20" fill="#6b3f16" stroke="url(#gold)" stroke-width="6"/>
    <text x="800" y="492" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#fff4df" letter-spacing="4">DISTRICT</text>
  </g>

  <text x="800" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="3">NEW SOUTH WALES</text>
  <text x="800" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#dbe9ff" opacity="0.95">Westhaven MDT Background Logo</text>
</svg>
