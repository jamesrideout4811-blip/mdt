<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Westhaven Unified MDT</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app" class="hidden">
    <aside>
      <h1>Westhaven MDT<span>/MDT</span></h1>
      <p id="me">Unit</p>
      <button data-tab="reports">Reports</button>
      <button data-tab="incidents">Incidents</button>
      <button data-tab="bulletins">Bulletins</button>
      <button data-tab="workers">Active Workers</button>
      <button data-tab="callsign">Call Sign</button>
      <button data-tab="dov">DOV</button>
      <button data-tab="reg">Registration</button>
      <button data-tab="impound">Impound</button>
      <button data-tab="licensing">Licensing</button>
      <button data-tab="justice">Fines/Jail</button>
      <button data-tab="dispatch">Dispatch</button>
      <button data-tab="corrections">RCORE Custody</button>
      <button data-tab="training">PD Training</button>
      <button data-tab="employment">Hire/Fire</button>
      <button id="close">Close</button>
    </aside>
    <main>
      <section id="content"></section>
    </main>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
